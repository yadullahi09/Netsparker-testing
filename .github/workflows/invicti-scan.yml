name: Invicti Security Scan

on:
  push:
    branches: [ "master", "main" ]

jobs:
  invicti-scan:
    runs-on: ubuntu-latest
    # The modern 2026 way: Define the scanner as a container service
    container:
      image: invicti/enterprise-scanner:latest
      options: --user root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Dynamic Scan
        shell: bash
        run: |
          # The binary is pre-installed in the container
          invicti-enterprise-scan \
            --address "https://www.your-test-site.com" \
            --target-id "${{ secrets.INVICTI_TARGET_ID }}" \
            --auth-token "${{ secrets.INVICTI_AUTH_TOKEN }}" \
            --fail-on-severity "High" \
            --api-url "https://www.netsparkercloud.com"
